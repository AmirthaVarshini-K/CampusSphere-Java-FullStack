spring:
  datasource:
    url: jdbc:h2:mem:campussphere-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS campussphere
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: campussphere
  flyway:
    enabled: true
    default-schema: campussphere

campus-sphere:
  security:
    jwt:
      secret: campussphere-test-secret
  seed:
    admin-email: admin@campussphere.edu
    admin-password: Admin@1234!
    faculty-email: coordinator@campussphere.edu
    faculty-password: Faculty@1234!

spring:
  datasource:
    url: "jdbc:h2:file:./campussphere-data/campussphere;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS campussphere"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: campussphere
  flyway:
    enabled: true
    default-schema: campussphere

campus-sphere:
  seed:
    admin-email: admin@campussphere.local
    admin-password: Admin@Local123!
    faculty-email: coordinator@campussphere.local
    faculty-password: Faculty@Local123!

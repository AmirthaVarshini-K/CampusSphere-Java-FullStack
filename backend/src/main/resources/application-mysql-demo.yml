spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campussphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:campussphere}
    password: ${DB_PASSWORD:campussphere}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

campus-sphere:
  security:
    jwt:
      secret: ${JWT_SECRET:campussphere-mysql-demo-secret}
  seed:
    admin-email: admin@campussphere.local
    admin-password: Admin@Local123!
    faculty-email: coordinator@campussphere.local
    faculty-password: Faculty@Local123!

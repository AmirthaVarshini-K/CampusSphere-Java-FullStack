spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: campussphere

campus-sphere:
  frontend-base-url: ${FRONTEND_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      issuer: ${JWT_ISSUER:campussphere}
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
      reset-token-minutes: ${JWT_RESET_TOKEN_MINUTES:20}
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}

logging:
  level:
    root: INFO
    com.campussphere: INFO
